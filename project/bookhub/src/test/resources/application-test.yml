spring:
  datasource:
    url: jdbc:h2:mem:bookhub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2-schema.sql
      data-locations: classpath:db/h2-data.sql

logging:
  level:
    com.bookhub: info
    com.bookhub.mapper: info
